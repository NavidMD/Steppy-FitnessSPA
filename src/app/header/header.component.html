<mat-toolbar>
  <div class="w-full flex justify-start items-center gap-x-8">
    <button
      (click)="onMenuBtnClick()"
      class="flex justify-center items-center p-2.5 twBackgroundGradient twGradientButton rounded-xl"
    >
      <mat-icon>menu_open</mat-icon>
    </button>
    <button routerLink="/" class="cursor-pointer text-[22px] font-bold ml-4">
      <span class="twTextGradient font-bold text-[32px] font-sans"
        ><mat-icon class="pt-1">fitness_center</mat-icon>Steppy</span
      >
    </button>
    <nav class="w-full text-[17px]">
      <ul class="flex flex-row justify-start gap-x-10 text-headingsColor">
        <li routerLink="/training">تمرین های من</li>
        <li>مربیان</li>
        <li>مقالات</li>
        <li>درباره ما</li>
      </ul>
    </nav>
  </div>
  <div class="w-full flex justify-end items-center">
    <button
      *ngIf="authStatus === false"
      routerLink="/login"
      class="twFlexCentering gap-1.5 pl-3.5 pr-3 py-1.5 text-[15px] twBackgroundGradient twGradientButton rounded-xl"
    >
      <mat-icon>person</mat-icon>
      ورود به حساب
    </button>
    <button
      id="logout-btn"
      *ngIf="authStatus === true"
      (click)="logout()"
      class="text-[16px] bg-red-500/80 twGradientButton text-white px-2.5 rounded-xl ml-1.5 hover:bg-red-500 transition"
    >
      <mat-icon>logout</mat-icon>
    </button>
    <button
      id="welcome-btn"
      *ngIf="authStatus === true"
      routerLink="/training"
      class="text-[15px] twBackgroundGradient twGradientButton p-2.5 rounded-xl"
    >
      <span class="overflow-hidden inline">خوش اومدی {{userFirstName}} :)</span>
      <mat-icon>person</mat-icon>
    </button>
  </div>
</mat-toolbar>
