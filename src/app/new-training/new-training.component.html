<mat-card
  [ngClass]="{
    hard: addedExercise.type === 'قدرتی',
    normal: addedExercise.type === 'ایزومتریک',
    easy: addedExercise.type === 'هوازی',
  }"
>
  <p class="text-[15px] text-headingsColor max-900:text-[15px] max-md:text-[14px] [@media(max-width:400px)]:text-13px [@media(max-width:400px)]:leading-5">
    {{ addedExercise.name }}
  </p>
  <img
    class="w-full h-full object-contain max-[520px]:hidden"
    [src]="'../../assets/vectors/' + addedExercise.name + '.png'"
    alt=""
  />
  <p class="text-[14px] text-btnSecondColor max-900:text-[13px] max-[400px]:text-[12px]">
    <span class="font-bold text-[17px] max-900:text-[15px] max-[400px]:text-[14px]">{{
      addedExercise.sets
    }}</span>
    ست
  </p>
  <p class="text-[14px] text-btnSecondColor max-900:text-[13px] max-[400px]:text-[12px]">
    <span class="font-bold text-[17px] max-900:text-[15px] max-[400px]:text-[14px]">{{
      addedExercise.reps
    }}</span>
    تکرار
  </p>
  <p class="text-[14px] text-btnSecondColor max-900:text-[13px] max-md:hidden">
    {{ addedExercise.type }}
  </p>
  <p id="date" class="text-[14px] text-btnSecondColor max-900:text-[13px] max-[400px]:text-[12px] max-[400px]:text-left">
    {{ addedExercise.dateAdded.toDate() | jalali }}
  </p>
  <div
    class="w-full h-full flex flex-row justify-end items-center gap-x-3 max-900:gap-x-2 max-sm:col-span-full max-sm:justify-center max-sm:border-t max-sm:border-black/10"
  >
    <button
      class="text-blue-400"
      [matTooltip]="'درباره حرکت ' + addedExercise.name + ' بیشتر بدانید'"
    >
      <a [href]="'https://fitamin.ir/mag/movement/' + addedExercise.name + '/'">
        <mat-icon>help</mat-icon>
      </a>
    </button>
    <button
      class="text-green-600"
      matTooltip="شروع تمرین"
      [routerLink]="['/training/', addedExercise.id]"
    >
      <mat-icon>play_circle</mat-icon>
    </button>
    <button class="text-red-600" matTooltip="حذف تمرین" (click)="delete()">
      <mat-icon>cancel</mat-icon>
    </button>
  </div>
</mat-card>
