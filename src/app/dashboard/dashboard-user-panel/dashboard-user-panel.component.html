<mat-card class="h-full py-6 px-5">
  <div id="avatar" class="w-full h-fit flex justify-center items-center py-5">
    <img
      class="object-contain w-36 h-36"
      src="../../../assets/vectors/profile-male.png"
      alt=""
    />
  </div>
  <div
    id="profile-name"
    class="w-full h-fit flex flex-col justify-center items-center py-1 pb-5"
  >
    <p class="font-bold text-xl pb-2 text-headingsColor/80">نوید معین درباری</p>
    <p class="text-sm text-btnSecondColor">عضویت دائم</p>
  </div>
  <div
    id="user-info"
    class="w-full h-20 rounded-2xl bg-steppylightBlue/50 grid grid-cols-3 grid-rows-2 place-items-center py-2.5 px-2"
  >
    <p class="text-black/60 text-[13px]">قد(cm)</p>
    <p class="text-black/60 text-[13px]">سن</p>
    <p class="text-black/60 text-[13px]">وزن(kg)</p>
    <p class="text-headingsColor/80 font-sans font-semibold text-xl">190</p>
    <p class="text-headingsColor/80 font-sans font-semibold text-xl">27</p>
    <p class="text-headingsColor/80 font-sans font-semibold text-xl">100</p>
  </div>
  <ul class="py-4 border-t mt-4 border-steppylightBlue">
    <li><mat-icon>checklist_rtl</mat-icon>برنامه های تمرینی من</li>
    <li><mat-icon>history</mat-icon>تاریخچه خریدها</li>
    <li><mat-icon>message</mat-icon>پیام ها</li>
    <li><mat-icon>insights</mat-icon>روند پیشرفت</li>
  </ul>
  <div id="action" class="mt-auto w-full flex flex-row gap-3">
    <button class=" bg-red-400 w-1/3 py-3 rounded-xl text-white shadow-md shadow-black/20 flex justify-center gap-1 items-center">
      <mat-icon>power_settings_new</mat-icon>
      خروج
    </button>
    <button class=" bg-white w-2/3 py-3 rounded-xl text-red-500 twCustomSoftShadow flex justify-center gap-1 items-center">
      <mat-icon>person_remove</mat-icon>
      حذف حساب کاربری
    </button>
  </div>
</mat-card>
