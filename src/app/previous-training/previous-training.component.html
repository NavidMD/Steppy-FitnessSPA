<mat-card>
  <p class="text-[16px] text-headingsColor">{{ completedExercise.name }}</p>
  <img
    class="w-full h-full object-contain"
    [src]="'../../assets/vectors/' + completedExercise.name + '.png'"
    alt=""
  />
  <p class="text-[15px] text-btnSecondColor">
    <span class="font-bold text-[17px]">{{ completedExercise.sets }}</span> ست
  </p>
  <p class="text-[15px] text-btnSecondColor">
    <span class="font-bold text-[17px]">{{ completedExercise.reps }}</span>
    تکرار
  </p>
  <p class="text-[15px] text-btnSecondColor">
    {{ completedExercise.dateCompleted.toDate() | jalali }}
  </p>
  <div class="w-full flex flex-row justify-end items-center gap-x-3">
    <button
      class="text-blue-400"
      [matTooltip]="'درباره حرکت ' + completedExercise.name + ' بیشتر بدانید'"
    >
      <a
        [href]="
          'https://fitamin.ir/mag/movement/' + completedExercise.name + '/'
        "
      >
        <mat-icon>help</mat-icon>
      </a>
    </button>
    <button
      class="text-red-600"
      matTooltip="حذف تمرین"
      (click)="deleteExerciseHandler()"
    >
      <mat-icon>cancel</mat-icon>
    </button>
  </div>
</mat-card>
