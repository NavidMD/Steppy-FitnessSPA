<mat-card>
  <p class="text-[16px] text-headingsColor">{{addedExercise.name}}</p>
  <img class="w-full h-full object-contain" [src]="'../../assets/vectors/' + addedExercise.name + '.png'" alt="">
  <p class="text-[15px] text-btnSecondColor"><span class="font-bold text-[17px]">{{addedExercise.sets}}</span> ست</p>
  <p class="text-[15px] text-btnSecondColor"><span class="font-bold text-[17px]">{{addedExercise.reps}}</span> تکرار</p>
  <p class="text-[15px] text-btnSecondColor">{{addedExercise.dateAdded | jalali}}</p>
  <div class="w-full flex flex-row justify-end items-center gap-x-3">
    <button class="text-blue-400" [matTooltip]="'درباره حرکت ' + addedExercise.name + ' بیشتر بدانید'">
      <a [href]="'https://fitamin.ir/mag/movement/'+addedExercise.name+'/'"> <mat-icon>help</mat-icon> </a>
    </button>
    <button class="text-green-600" matTooltip="شروع تمرین" [routerLink]="['/training/',addedExercise.id]">
      <mat-icon>play_circle</mat-icon>
    </button>
    <button class="text-red-600" matTooltip="حذف تمرین">
      <mat-icon>cancel</mat-icon>
    </button>
  </div>
</mat-card>
